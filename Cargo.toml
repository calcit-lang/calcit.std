[package]
name = "calcit_std"
version = "0.2.30"
authors = ["jiyinyiyong <jiyinyiyong@gmail.com>"]
edition = "2024"


[lib]
name = "calcit_std"
path = "src/lib.rs"
crate-type = ["cdylib"] # Self-contained C ABI library; avoids Rust symbol interposition with the host.


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
calcit_native_ffi = "0.1.3"
serde = { version = "1.0.185", features = ["derive"] }
serde_json = "1.0.149"
chrono = "0.4.44"
cirru_edn = "0.8.0"
cirru_parser = "=0.2.15"
nanoid = "0.4.0"
rand = "0.8.5"
ctrlc = "3.5.2"
md5 = "0.7.0"
walkdir = "2.5.0"
glob = "0.3.3"

# [profile.release]
# lto = true
# codegen-units = 1
# opt-level = "z"  # Optimize for size.
