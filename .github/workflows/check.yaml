on:
  push:
    branches:
      - master
      - main
  pull_request: {}

name: Test

permissions:
  contents: read

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          version: "0.28.0"
          caps-version: "0.1.1"

      - name: Install the production FFI generator
        run: cargo install calcit-bindgen --version 0.1.1 --locked

      - name: Validate Calcit snapshot and type baseline
        run: |
          caps --strict --ci
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only --strict-types
          calcit calcit.cirru analyze quality --format json
          calcit calcit.cirru analyze check-public --ns calcit.std.fs --ns calcit.std.date --ns calcit.std.hash --ns calcit.std.path --ns calcit.std.process --ns calcit.std.rand --ns calcit.std.time --ns calcit.std.util --summary-only --format json
          mkdir -p target/ffi-interface
          calcit calcit.cirru ffi export --json --ns calcit.std.hash > target/ffi-interface/calcit-std-hash.json
          calcit-bindgen check target/ffi-interface/calcit-std-hash.json --out generated/ffi --backend rust

      - run: cargo fmt --check && cargo build --release

      - run: cargo test

      - run: cargo clippy --all-targets -- -D warnings

      - run: mkdir -p dylibs/ && ls target/release/ && cp -v target/release/libcalcit_std.* dylibs/

      - name: Validate runnable docs and async examples
        run: |
          calcit calcit.cirru docs check-md README.md --dep ./ --failures-only
          calcit calcit.cirru docs check-md docs/native-capabilities.md --dep ./ --failures-only
          calcit calcit.cirru analyze check-examples --ns calcit.std.fs --def read-file-by-line!
          calcit calcit.cirru analyze check-examples --ns calcit.std.process --def stream!
          calcit calcit.cirru analyze check-examples --ns calcit.std.process --def on-ctrl-c
          calcit calcit.cirru analyze check-examples --ns calcit.std.time --def set-timeout
          calcit calcit.cirru analyze check-examples --ns calcit.std.time --def set-interval

      - run: bash scripts/check-c-safe-ffi.sh

      - name: Validate definition-attached filesystem contracts
        run: calcit calcit.cirru test --tag filesystem --require-match

      - name: Reject invalid read parameters before FFI
        run: |
          for reader in read-file read-dir walk-dir 'read-file!' 'read-dir!' 'walk-dir!'; do
            if calcit calcit.cirru eval --dep ./ -- "ns app.main \$ :require \$ calcit.std.fs :as fs
          fs/$reader 3" >target/read-type-negative.log 2>&1; then
              echo "Invalid Number argument unexpectedly accepted by $reader" >&2
              exit 1
            fi
            grep -F '[W_FN_ARG_TYPE_MISMATCH]' target/read-type-negative.log
            grep -F "calcit.std.fs/$reader" target/read-type-negative.log
          done

      - run: bash scripts/check-c-safe-async.sh

      - name: Trace focused cross-toolchain random FFI call
        run: |
          calcit --trace-ffi calcit.cirru eval --dep ./ -- 'ns app.main $ :require
            calcit.std.rand :refer $ rand rand-int rand-nth

          println (rand-nth $ range 10) (rand (Option :none) (Option :none)) (rand-int (Option :some 10) (Option :none))'

      - run: calcit calcit.cirru
